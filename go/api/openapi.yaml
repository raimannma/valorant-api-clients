components:
  schemas:
    APIError:
      example:
        code: 0
        details: ""
        message: message
        status: 0
      properties:
        code:
          format: int32
          minimum: 0
          type: integer
        details: {}
        message:
          type: string
        status:
          format: int32
          minimum: 0
          type: integer
      required:
      - code
      - message
      - status
    AccoladeKind:
      description: |-
        Known Goldstar IDs documented at https://valdocs.prometheuz.me/endpoint/goldstars.
        New IDs remain available via `GoldstarDefinition::id` even if not listed here.
      enum:
      - kills
      - first_blood
      - damage_per_round
      - clutches
      - aces
      - trades
      - headshot_percentage
      - distinction
      - assists
      - top_frag
      - plants
      - mvp
      type: string
    AccoladesV1Account:
      example:
        name: name
        puuid: puuid
        tag: tag
      properties:
        name:
          type: string
        puuid:
          type: string
        tag:
          type: string
      required:
      - name
      - puuid
      - tag
    AccoladesV1Data:
      example:
