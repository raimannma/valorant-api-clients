  /valorant/v2/premier/teams/{affinity}/{name}/{tag}:
    get:
      description: "Resolves distinct candidate team IDs from the existing team index,\
        \ then verifies their current name, tag and affinity against Riot without\
        \ roster caching. Teams absent from the index cannot be discovered by name.\
        \ At most 25 candidates are checked, with at most four concurrent roster fetches\
        \ and a ten-second deadline covering index lookup and Riot verification. More\
        \ than 25 candidates, an expired deadline or a non-404 upstream failure returns\
        \ 500 rather than a partial result. Stale Riot 404 candidates are skipped.\
        \ A unique result or 404 requires complete candidate exhaustion; two verified\
        \ live matches return 409. Returns the same response as team lookup by ID;\
        \ the seasons list may include the current season."
      operationId: premier_by_name_v2
      parameters:
      - description: Region/affinity; case-insensitive
        explode: false
        in: path
        name: affinity
        required: true
        schema:
          $ref: "#/components/schemas/ValorantAffinity"
        style: simple
      - description: Premier team name
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      - description: Premier team tag
        explode: false
        in: path
        name: tag
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremierTeamV2Response"
          description: Premier team retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendError"
          description: Invalid region or empty name/tag
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendError"
          description: No matching team found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendError"
          description: Multiple teams match; use team ID lookup
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendError"
          description: Failed to resolve the team or fetch Riot data
      summary: Get live Premier team by team name (v2)
      tags:
      - valorant
  /valorant/v2/premier/players/{affinity}/{puuid}:
