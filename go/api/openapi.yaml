openapi: 3.1.0
info:
  description: ""
  license:
    name: ""
  title: HenrikDev API
  version: 4.6.0
servers:
- url: https://api.henrikdev.xyz
security:
- api_key_header: []
- api_key_query: []
tags:
- description: Valorant public API endpoints
  name: valorant
- description: Premium account and webhook endpoints
  name: premium
paths:
  /valorant/v1/account/{name}/{tag}:
    get:
      operationId: get_account_v1
      parameters:
      - description: Riot ID name
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      - description: Riot ID tag
        explode: false
        in: path
        name: tag
        required: true
        schema:
          type: string
        style: simple
      - description: Bypass cache and refresh (optional)
        explode: true
        in: query
        name: force
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountV1Response"
          description: Account data retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendError"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendError"
          description: Account not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendError"
          description: Internal Server Error
      summary: Get account (v1)
      tags:
      - valorant
