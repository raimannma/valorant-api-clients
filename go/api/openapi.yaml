        name: tag
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMasteryV1Response"
          description: Mastery retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendError"
          description: "Invalid region, platform or UUID"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendError"
          description: Account not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendError"
          description: Unable to fetch or parse mastery
      summary: Get all agent mastery by name (v1)
      tags:
      - valorant
