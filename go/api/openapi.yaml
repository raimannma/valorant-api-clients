      description: "Raw Riot request. Resource names are case-sensitive. Region and\
        \ platform are case-insensitive; platform defaults to pc. Matchdetails accepts\
        \ one or multiple match UUIDs, ignores queries, and returns an object for\
        \ one result or an array for multiple results. Other resources use a player\
        \ UUID (only the first array entry) and forward queries unchanged; include\
        \ the leading ? when supplying a query string."
      example:
        platform: ""
        queries: queries
        region: na
        type: matchdetails
        value: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        platform:
          allOf:
          - $ref: "#/components/schemas/ValorantPlatform"
          nullable: true
        queries:
          nullable: true
          type: string
        region:
          $ref: "#/components/schemas/ValorantAffinity"
        type:
          $ref: "#/components/schemas/RawV1ResourceType"
        value:
          $ref: "#/components/schemas/RawV1PayloadValues"
      required:
      - region
      - type
      - value
    RawV1PayloadValues:
      description: A UUID string or a nonempty UUID array. Matchdetails fetches every
        array entry; all other resource types use only the first entry.
      oneOf:
