  /valorant/v1/agent-mastery/{affinity}/{platform}/{name}/{tag}:
    get:
      description: Modules are null when not included by Riot; use the single-agent
        endpoint for modules. Unknown metadata names and omitted levels are null.
        Short and long levels retain Riot's source semantics.
      operationId: get_mastery_by_name
      parameters:
      - description: Region/affinity; case-insensitive
        explode: false
        in: path
        name: affinity
        required: true
        schema:
          $ref: "#/components/schemas/ValorantAffinity"
